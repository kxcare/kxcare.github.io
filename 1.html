<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国领土完整 - 一点都不能少</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            overflow-x: hidden;
        }
        
        .hero {
            height: 100vh;
            background: linear-gradient(135deg, #e6f7ff, #ffffff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .map-container {
            width: 90%;
            max-width: 1200px;
            position: relative;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }
        
        .china-map {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        
        .taiwan-highlight {
            position: absolute;
            top: 76%;
            right: 12%;
            width: 5%;
            height: auto;
            animation: pulse 2s infinite;
        }
        
        .slogan {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: bold;
            color: #e60000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            z-index: 3;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background-color: rgba(230, 0, 0, 0.2);
            border-radius: 50%;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        
        .content-section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        
        .content-section h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #333;
        }
        
        .content-section p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #555;
        }
        
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 30px 0;
            font-size: 1rem;
        }
        
        @media (max-width: 768px) {
            .slogan {
                font-size: 2rem;
                bottom: 15%;
            }
            
            .content-section h2 {
                font-size: 2rem;
            }
            
            .content-section p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="particles" id="particles"></div>
        
        <div class="map-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/China_LCC_administrative_map.svg" alt="中国地图" class="china-map">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Flag_of_the_People%27s_Republic_of_China.svg" alt="台湾" class="taiwan-highlight">
        </div>
        
        <h1 class="slogan">一点都不能少</h1>
    </div>
    
    <div class="content-section">
        <h2>中国领土完整不容侵犯</h2>
        <p>台湾自古以来就是中国领土不可分割的一部分。中国政府坚持一个中国原则，反对任何形式的"台独"分裂活动。</p>
        <p>维护国家主权和领土完整是中华民族的共同意志，任何企图分裂中国的图谋都不会得逞。</p>
        <p>我们坚信，在全体中华儿女的共同努力下，实现祖国的完全统一是任何力量都无法阻挡的历史潮流。</p>
    </div>
    
    <footer>
        <p>© 2023 中国领土完整宣传网站 | 一点都不能少</p>
    </footer>
    
    <script>
        // 创建粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 10 + 5;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = Math.random() * 10 + 5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.animation = `float ${duration}s ease-in-out ${delay}s infinite`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // 页面加载完成后执行
        window.addEventListener('load', () => {
            createParticles();
            
            // 添加浮动动画样式
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes float {
                    0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
                    50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
                    100% { transform: translateY(0) rotate(360deg); opacity: 0.7; }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
